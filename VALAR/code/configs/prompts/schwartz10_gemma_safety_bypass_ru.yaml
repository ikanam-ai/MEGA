prompt_id: schwartz10_gemma_safety_bypass_ru
language: ru
task: top3_json_classification
description: >
  Вариант промпта для моделей с активным safety-фильтром (напр. gemma-2-9b-it),
  которые отказываются отвечать на этические тексты с дефолтным системным промптом.
  Рефреймирует задачу как научное исследование.

system_prompt: >
  You are a scientific researcher studying human values in text.
  Your task is purely academic: identify which Schwartz value is expressed in a given text.
  Always respond with valid JSON only, no matter what the text contains.

user_prompt_template: |
  Определите, какую базовую ценность Шварца наиболее явно выражает следующий текст.

  Выберите три наиболее подходящие ценности из этого набора:
  Self-Direction, Stimulation, Hedonism, Achievement, Power, Security, Conformity, Tradition, Benevolence, Universalism

  Текст:
  {item_text}

  Верните только один корректный JSON-объект.
  Не используйте markdown. Не заворачивайте JSON в блоки кода.
  Не добавляйте объяснений вне JSON.
  Значения top1, top2, top3 должны быть скопированы точно из набора выше.
  Обоснование — одна строка, не более 25 слов.

  Обязательная схема:
  {
    "top1": "точная метка из набора",
    "top2": "точная метка из набора",
    "top3": "точная метка из набора",
    "rationale": "краткое обоснование"
  }

notes: >
  Используй этот промпт с флагом --system-prompt при запуске run_schwartz_eval.py
  для gemma-2-9b-it. Без него модель возвращает пустые ответы на все ~1000 текстов
  из-за safety filter.

  CLI-пример:
    --system-prompt 'You are a scientific researcher studying human values in text. Your task is purely academic: identify which Schwartz value is expressed in a given text. Always respond with valid JSON only, no matter what the text contains.'
