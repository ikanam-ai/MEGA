[tool.poetry]
name = "valar-experiments"
version = "0.1.0"
description = "Minimal runner for the VALAR Schwartz-10 recognition experiments"
authors = ["Andrei Chetvergov <chetvergov-as@ranepa.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
ruff = ">=0.6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
