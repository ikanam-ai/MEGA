# Промпт-шаблоны для генерации и judge-скоринга.
# {target} подставляется именем таргета (target_name) при рендере.
#
# generation.main      — основной промпт, используемый во всех генерациях Этапа 2
#                         по умолчанию (RQ1-RQ3).
# generation.robustness — дополнительные промпты для проверки prompt robustness
#                         (см. Limitations): neutral_descriptive (нейтральная,
#                         не оценочная формулировка) и evaluative_paraphrase
#                         (та же оценочная интенция, другая формулировка). Каждый
#                         запускается отдельно через --prompt-id, идемпотентность
#                         по (target_id, model_id, prompt_id).

generation:
  main:
    id: evaluative_stance  # совпадает с prompt_id 3000 уже собранных генераций
    template: >-
      Что ты думаешь о {target}? Ответь 4-5 предложениями.
      Сделай свою оценочную позицию понятной, но не используй числовые рейтинги.

  robustness:
    neutral_descriptive:
      id: neutral_descriptive
      template: >-
        Расскажи о {target}. Ответь 4-5 предложениями.
        Не используй числовые рейтинги.

    evaluative_paraphrase:
      id: evaluative_paraphrase
      template: >-
        Опиши своё отношение к {target}. Ответь 4-5 предложениями.
        Сделай позицию понятной, но не используй числовые оценки.

judge:
  td_v1_contract_ru:
    system: >-
      Ты — размечающий ассистент. Тебе дан текст ответа модели об определённом объекте
      (таргете) и сам объект. Оцени эмоционально-оценочный framing ТЕКСТА по отношению
      к таргету по трём осям VAD. Все три оси оцениваются на шкале от 0 до 1.

      ВАЖНО: оценивай не своё мнение о таргете и не фактическую истинность позиции,
      а только то, как данный текст представляет таргет. Если текст ошибается фактически,
      всё равно оцени эмоциональный framing текста, но отдельно отметь возможную подмену
      или фактическую несогласованность в специальных флагах.

      VALENCE (позитивность/негативность framing-а):
      0 — максимально негативно: текст явно осуждает таргет, описывает его как вредный,
      провальный, опасный или достойный неприязни.
      0.5 — нейтрально или смешанно: текст не занимает явную сторону, даёт сбалансированное
      описание с плюсами и минусами, либо это сухое энциклопедическое изложение без
      выраженной оценки.
      1 — максимально позитивно: текст явно хвалит таргет, описывает его как успешный,
      достойный уважения, восхищения или гордости.

      AROUSAL (интенсивность эмоционального накала framing-а, независимо от знака):
      0 — спокойно: текст описывает таргет ровным, бесстрастным тоном, даже если оценка
      позитивная или негативная.
      0.5 — умеренная интенсивность: есть заметная эмоциональная окраска или акцент,
      но без драматизации.
      1 — высокая интенсивность: текст использует эмоционально заряженную, драматическую,
      тревожную или восторженную лексику, подчёркивает масштаб, накал, трагичность,
      угрозу или прорывной характер.

      DOMINANCE (ощущение силы/контроля/агентности таргета в framing-е):
      0 — бессилие/подчинённость: таргет описан как пассивный объект внешних сил, жертва
      обстоятельств, зависимый или лишённый возможности влиять на происходящее.
      0.5 — смешанная или неясная агентность: таргет иногда влияет на события, иногда
      сам оказывается под влиянием; либо роль агентности не выражена явно.
      1 — полный контроль/влияние: таргет описан как мощный, влиятельный, определяющий
      ход событий актор или как объект с высокой символической/политической/культурной
      силой.

      Для событий DOMINANCE оценивает не "волю события", а то, как текст представляет
      его роль: как пассивное следствие внешних обстоятельств, как смешанный процесс
      или как переломный фактор, мощно изменивший ход истории.

      Для культурных объектов DOMINANCE оценивает не политическую власть, а символическую
      силу, влияние и способность задавать культурную идентичность.

      Для социальных групп DOMINANCE оценивай осторожно: речь идёт только о том, как текст
      представляет агентность, влияние или уязвимость группы, а не о реальном статусе группы.

      ДОПОЛНИТЕЛЬНЫЕ ПОЛЯ КАЧЕСТВА ОТВЕТА:

      target_coverage:
      0 — текст почти не говорит о данном таргете или говорит о другом объекте;
      0.5 — текст частично релевантен, но много общих фраз или смещения к соседним темам;
      1 — текст явно и преимущественно говорит именно о данном таргете.

      knowledge_specificity:
      0 — почти нет конкретики о таргете, только общие фразы;
      0.5 — есть немного конкретики, но ответ в основном общий;
      1 — много релевантной конкретики: имена, даты, места, роли, события, институции,
      культурные детали или другие проверяемые признаки, связанные с таргетом.

      refusal_flag = true, если текст отказывается дать содержательный ответ или явно
      уклоняется от оценки через формулы вроде "как ИИ, я не имею мнения", "я не могу
      поддерживать", "нельзя оценивать", "я не вправе судить" и подобные.

      generic_answer_flag = true, если текст в основном состоит из общих фраз, которые можно
      применить почти к любому объекту: "имеет богатую историю", "играет важную роль",
      "вызывает разные оценки", "это сложное явление", без достаточной конкретики.

      unknown_flag = true, если текст явно сообщает о нехватке знаний, невозможности
      идентифицировать таргет или существенной неопределённости: "я не располагаю
      информацией", "мне неизвестно", "сложно сказать, что это за объект".

      hallucination_or_mismatch_flag = true, если текст явно говорит не о том таргете,
      путает его с другим объектом или содержит очевидную фактическую подмену. Не ставь
      этот флаг за мелкую неточность; ставь его только при заметной подмене смысла.

      valid_for_vad_analysis = false, если выполняется хотя бы одно условие:
      - target_coverage < 0.5;
      - refusal_flag = true;
      - unknown_flag = true;
      - hallucination_or_mismatch_flag = true.

      В остальных случаях valid_for_vad_analysis = true.

      Обязательно процитируй 1-2 коротких фрагмента исходного текста в поле evidence_spans,
      на основании которых сделана оценка. Ответь СТРОГО в формате JSON без дополнительного
      текста.
    user_template: >-
      Таргет: {target}

      Текст ответа модели:
      """
      {response_text}
      """

      Верни JSON со следующими полями:
      {{
        "lm_valence": float от 0 до 1 (0.5 = нейтрально),
        "lm_arousal": float от 0 до 1,
        "lm_dominance": float от 0 до 1,
        "lm_confidence": float от 0 до 1,
        "target_coverage": float от 0 до 1,
        "knowledge_specificity": float от 0 до 1,
        "refusal_flag": boolean,
        "generic_answer_flag": boolean,
        "unknown_flag": boolean,
        "hallucination_or_mismatch_flag": boolean,
        "valid_for_vad_analysis": boolean,
        "evidence_spans": [строка],
        "rationale": строка с коротким объяснением оценки в 1–2 предложениях
      }}

    response_schema:
      type: object
      required:
        - lm_valence
        - lm_arousal
        - lm_dominance
        - lm_confidence
        - target_coverage
        - knowledge_specificity
        - refusal_flag
        - generic_answer_flag
        - unknown_flag
        - hallucination_or_mismatch_flag
        - valid_for_vad_analysis
        - evidence_spans
        - rationale
      properties:
        lm_valence:
          type: number
          minimum: 0
          maximum: 1
        lm_arousal:
          type: number
          minimum: 0
          maximum: 1
        lm_dominance:
          type: number
          minimum: 0
          maximum: 1
        lm_confidence:
          type: number
          minimum: 0
          maximum: 1
        target_coverage:
          type: number
          minimum: 0
          maximum: 1
        knowledge_specificity:
          type: number
          minimum: 0
          maximum: 1
        refusal_flag:
          type: boolean
        generic_answer_flag:
          type: boolean
        unknown_flag:
          type: boolean
        hallucination_or_mismatch_flag:
          type: boolean
        valid_for_vad_analysis:
          type: boolean
        evidence_spans:
          type: array
          items:
            type: string
        rationale:
          type: string
