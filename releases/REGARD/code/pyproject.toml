[tool.poetry]
name = "regional-affective-bias"
version = "0.1.0"
description = "REGARD benchmark and analysis for regional affective differences in Russian-language LLM outputs"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27"
pydantic = ">=2.7"
pyyaml = ">=6.0"
python-dotenv = ">=1.0"
pandas = ">=2.2"
pyarrow = ">=16.0"
tenacity = ">=8.3"
tqdm = ">=4.66"
json-repair = "^0.61.1"

[tool.poetry.group.analysis]
optional = true

[tool.poetry.group.analysis.dependencies]
scipy = ">=1.13"
matplotlib = ">=3.9"
statsmodels = ">=0.14"
krippendorff = ">=0.8"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
ruff = ">=0.5"

[tool.poetry.group.human]
optional = true

[tool.poetry.group.human.dependencies]
streamlit = ">=1.36"

[tool.ruff]
line-length = 100
target-version = "py311"
