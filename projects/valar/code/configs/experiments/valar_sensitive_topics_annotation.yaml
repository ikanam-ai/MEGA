experiment:
  id: valar_sensitive_topics_annotation_v1
  title: VALAR — ValueLlama annotation of Russian sensitive/inappropriate topics
  dataset: russian_sensitive_inappropriate_topics
  annotator: valuellama_3_8b
  task: schwartz10_value_scoring

dataset:
  source: github:s-nlp/inappropriate-sensitive-topics
  local_path: "../../datasets/russian_sensitive_inappropriate_topics"
  versions:
    - Version1
    - Version2
    - Version3
  subsets:
    - appropriateness   # inappropriate messages
    - sensitive_topics  # sensitive topic classification
  text_field: text
  label_field: label
  id_field: id

annotation:
  construct: schwartz_10d
  label_set:
    - Self-Direction
    - Stimulation
    - Hedonism
    - Achievement
    - Power
    - Security
    - Conformity
    - Tradition
    - Benevolence
    - Universalism
  output_format: json_scores_schwartz10
  score_type: continuous

item_banks:
  output_path: data/item_banks/valar/sensitive_topics_annotation_items.jsonl

scoring:
  metrics:
    - top1_value_per_item
    - value_score_distribution
    - value_by_topic_label_breakdown
