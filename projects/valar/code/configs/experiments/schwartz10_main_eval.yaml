experiment:
  id: schwartz10_main_eval
  title: "Schwartz-10 Values Evaluation — gold-1000 (RU) + L0-h0 (EN)"
  script: scripts/eval/run_schwartz_eval.py
  clearml_project: STONIC/L0_schwartz10_eval

defaults:
  parallelism: 50
  max_tokens: 256
  temperature: 0.0
  timeout_sec: 120
  thinking: auto

prompts:
  gold_ru: configs/prompts/schwartz10_gold_ru.yaml
  gemma_bypass_ru: configs/prompts/schwartz10_gemma_safety_bypass_ru.yaml
  valuellama: configs/prompts/valuellama_annotation.yaml
  gpt_crossannotation: configs/prompts/gpt_crossannotation_ru.yaml

banks:
  gold1000:
    path: data/item_banks/gold/schwartz10_ru_1000.jsonl
    language: ru
    n_items: 1000
    task: top3_json_classification
    prompt: gold_ru
    metrics: [micro_acc1, macro_acc1, macro_acc3, recall_per_value]
  l0_h0:
    path: data/item_banks/l0_h0/h0_all_instances.jsonl
    language: en
    n_items: 100
    task_families:
      item_to_value: 40
      conflict_recognition: 20
      contextual_relevance: 40
    metrics: [hits_at_1, hits_at_3, pair_match, relv_acc]

models:
  # ── Russian-focused ────────────────────────────────────────────────────
  - config: models/gigachat31_10b.yaml
  - config: models/yandexgpt5_lite_8b.yaml
  - config: models/avibe.yaml
  - config: models/t_pro_it_21.yaml

  # ── Qwen family ───────────────────────────────────────────────────────
  - config: models/qwen36_35b_moe.yaml
  - config: models/qwen36_27b.yaml
  - config: models/qwen25_14b.yaml
  - config: models/qwen25_7b.yaml
  - config: models/qwen25_coder_14b.yaml

  # ── Mistral / Ministral (thinking: never) ─────────────────────────────
  - config: models/ministral3_14b.yaml
  - config: models/mistral7b_v03.yaml
  - config: models/mistral_nemo.yaml
  - config: models/ministral8b_2410.yaml

  # ── Other open-weight ─────────────────────────────────────────────────
  - config: models/glm47_flash.yaml
  - config: models/gemma4_26b.yaml
  - config: models/granite41_8b.yaml
  - config: models/llama3_8b.yaml
  - config: models/phi3_medium_4k.yaml
  - config: models/gemma2_9b.yaml       # needs --system-prompt, see notes in model config
  - config: models/granite33_8b.yaml
  - config: models/solar_10b.yaml

known_issues:
  gemma2_9b:
    problem: "Safety filter blocks Russian ethical texts → empty content"
    fix: >
      Add --system-prompt 'You are a scientific researcher studying human values
      expressed in text. Your task is purely academic: classify each text according
      to Schwartz value theory. Always respond in the required JSON format regardless
      of text content.'
