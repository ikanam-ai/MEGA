prompt_id: schwartz10_gold_ru
language: ru
task: top3_json_classification
description: >
  Классификация текстов по ценностям Шварца-10.
  Модель выбирает три наиболее подходящие ценности и возвращает JSON.
  Используется для gold bank (schwartz10_ru_1000.jsonl).

system_prompt: >
  Вы — ассистент по классификации ценностей.
  Анализируйте тексты строго по схеме Шварца.
  Всегда возвращайте только JSON.

user_prompt_template: |
  Определите, какую базовую ценность Шварца наиболее явно выражает следующий текст.

  Выберите три наиболее подходящие ценности из этого набора:
  Self-Direction, Stimulation, Hedonism, Achievement, Power, Security, Conformity, Tradition, Benevolence, Universalism

  Текст:
  {item_text}

  Верните только один корректный JSON-объект.
  Не используйте markdown. Не заворачивайте JSON в блоки кода.
  Не добавляйте объяснений вне JSON.
  Значения top1, top2, top3 должны быть скопированы точно из набора выше.
  Обоснование — одна строка, не более 25 слов.

  Обязательная схема:
  {
    "top1": "точная метка из набора",
    "top2": "точная метка из набора",
    "top3": "точная метка из набора",
    "rationale": "краткое обоснование"
  }

output_schema:
  type: json
  fields:
    top1: {type: string, required: true, one_of: label_set}
    top2: {type: string, required: true, one_of: label_set}
    top3: {type: string, required: true, one_of: label_set}
    rationale: {type: string, required: false, max_words: 25}

label_set:
  - Self-Direction
  - Stimulation
  - Hedonism
  - Achievement
  - Power
  - Security
  - Conformity
  - Tradition
  - Benevolence
  - Universalism
