# Registry used by the generation and scoring runners. All self-hosted models
# expose the OpenAI chat-completions contract through one VLLM_ENDPOINT.

generators:
  yandexgpt: &local_generator
    role: local
    url: "{VLLM_ENDPOINT}/chat/completions"
    model: YandexGPT-5-Lite-8B-instruct
    auth: {type: none}
    response_path: choices.0.message.content
    finish_reason_path: choices.0.finish_reason
  gigachat:
    <<: *local_generator
    model: GigaChat3.1-10B-A1.8B-bf16
  tpro:
    <<: *local_generator
    model: T-pro-it-2.1-FP8
  avibe:
    <<: *local_generator
    model: avibe

  qwen25_14b: &comparison_generator
    role: international
    url: "{VLLM_ENDPOINT}/chat/completions"
    model: Qwen2.5-14B-Instruct
    auth: {type: none}
    response_path: choices.0.message.content
    finish_reason_path: choices.0.finish_reason
  glm:
    <<: *comparison_generator
    model: GLM-4.7-Flash
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  gemma2_27b:
    <<: *comparison_generator
    model: gemma-4-26B-A4B-it
  ministral_14b:
    <<: *comparison_generator
    model: Ministral-3-14B-Instruct-2512-BF16
  granite:
    <<: *comparison_generator
    model: granite-4.1-8b
  granite3_8b:
    <<: *comparison_generator
    model: granite-3.3-8b-instruct
  llama3_8b:
    <<: *comparison_generator
    model: Meta-Llama-3-8B-Instruct
  ministral_8b:
    <<: *comparison_generator
    model: Ministral-8B-Instruct-2410
  mistral_7b:
    <<: *comparison_generator
    model: Mistral-7B-Instruct-v0.3
  mistral_nemo:
    <<: *comparison_generator
    model: Mistral-Nemo-Instruct-2407
  phi3_medium:
    <<: *comparison_generator
    model: Phi-3-medium-4k-instruct
  qwen25_7b:
    <<: *comparison_generator
    model: Qwen2.5-7B-Instruct
  qwen25_coder_14b:
    <<: *comparison_generator
    model: Qwen2.5-Coder-14B-Instruct
  qwen36_27b:
    <<: *comparison_generator
    model: Qwen3.6-27B
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  solar_10b:
    <<: *comparison_generator
    model: SOLAR-10.7B-Instruct-v1.0

judges:
  qwen36_35b:
    url: "{VLLM_ENDPOINT}/chat/completions"
    model: Qwen3.6-35B-A3B
    auth: {type: none}
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    response_path: choices.0.message.content
    finish_reason_path: choices.0.finish_reason
  gpt4o_mini:
    url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini-2024-07-18
    auth: {type: bearer_env, api_key_env: OPENAI_API_KEY}
    response_path: choices.0.message.content
    finish_reason_path: choices.0.finish_reason
